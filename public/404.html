<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Page not found · Ahmad Nashawi</title>
    <meta name="robots" content="noindex" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <style>
      :root {
        --bg: #0b0d17;
        --surface: #141829;
        --border: #262c47;
        --text: #e7e9f5;
        --muted: #9aa0bd;
        --accent: #6d7cff;
        --accent-2: #a46bff;
      }
      @media (prefers-color-scheme: light) {
        :root {
          --bg: #f6f7fc;
          --surface: #ffffff;
          --border: #e1e4f2;
          --text: #161a2e;
          --muted: #5b6283;
          --accent: #3f51f5;
          --accent-2: #8b3dff;
        }
      }
      * {
        box-sizing: border-box;
        margin: 0;
      }
      body {
        min-height: 100svh;
        display: grid;
        place-items: center;
        padding: 24px 16px;
        font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
        background:
          radial-gradient(600px 400px at 80% 0%, color-mix(in srgb, var(--accent-2) 20%, transparent), transparent 70%),
          var(--bg);
        color: var(--text);
        text-align: center;
      }
      .code {
        font-size: clamp(5rem, 22vw, 9rem);
        font-weight: 800;
        line-height: 1;
        letter-spacing: -0.05em;
        background: linear-gradient(100deg, var(--accent), var(--accent-2));
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
      }
      h1 {
        font-size: 1.5rem;
        margin: 12px 0 8px;
      }
      p {
        color: var(--muted);
        line-height: 1.7;
      }
      .links {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 12px;
        margin-top: 28px;
      }
      a {
        padding: 12px 22px;
        border-radius: 12px;
        font-weight: 600;
        text-decoration: none;
        color: var(--text);
        border: 1px solid var(--border);
        background: var(--surface);
      }
      a.primary {
        color: #fff;
        border: 0;
        background: linear-gradient(100deg, var(--accent), var(--accent-2));
      }
    </style>
  </head>
  <body>
    <main>
      <div class="code">404</div>
      <h1>This page took a wrong turn</h1>
      <p>The page you're looking for doesn't exist.<br /><span dir="rtl" lang="ar">الصفحة التي تبحث عنها غير موجودة.</span></p>
      <div class="links">
        <a class="primary" href="/">Back to the portfolio</a>
        <a href="/ar/" lang="ar">العودة إلى الموقع</a>
      </div>
    </main>
  </body>
</html>
